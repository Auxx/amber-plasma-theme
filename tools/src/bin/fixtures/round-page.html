<!doctype html>
<!-- A round widget is not a rounded corner (glossary): the circle passes, the
     oval does not. The button shows Chrome's own focus ring when focused.
     Used by browser.spec.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Round page</title>
</head>
<body>
<div class="circle" style="width: 16px; height: 16px; border-radius: 50%; background: #d1b072"></div>
<div class="oval" style="width: 40px; height: 16px; border-radius: 50%; background: #d1b072"></div>
<button class="plain" style="border: none; padding: 4px; background: #312e29; color: #e8e3da">Plain</button>
</body>
</html>
