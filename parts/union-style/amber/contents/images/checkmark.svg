<!-- The tick (P3.5): two bars 2 px thick with square ends, in a 5 x 9 box turned 45 degrees, as the prototype's .check-box::before. -->
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <g transform="rotate(45 7.5 6.5)" fill="#000000">
    <rect x="8" y="2" width="2" height="9" />
    <rect x="5" y="9" width="5" height="2" />
  </g>
</svg>
